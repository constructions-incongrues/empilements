name: Faircamp Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: LFS fetch
        run: |
          git lfs fetch --all && git lfs checkout

      - name: Restore .faircamp_cache
        id: cache-faircamp-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .faircamp_cache
          key: ${{ runner.os }}-faircamp-cache

      - name: Faircamp Build
        uses: addnab/docker-run-action@v3
        with:
            image: n3wjack/faircamp:latest
            options: -v ${{ github.workspace }}:/data
            run: |
                faircamp

      - name: Save .faircamp_cache
        id: cache-faircamp-save
        uses: actions/cache/save@v4
        with:
          path: |
            .faircamp_cache
          key: ${{ steps.cache-faircamp-restore.outputs.cache-primary-key }}